name: goshuin_app
description: A digital goshuin book app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 日本語対応
  flutter_localizations:
    sdk: flutter

  # 機能系
  mobile_scanner: ^6.0.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.0
  file_picker: ^6.1.1
  share_plus: ^12.0.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # ===== アセット設定（重要）=====
  assets:
    - assets/images/
